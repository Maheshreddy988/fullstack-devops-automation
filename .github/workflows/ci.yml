name: CI Pipeline

on:
  push:
    branches: ["dev", "main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Cancel older runs of the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# uses: runs a ready-made action written by someone else
# run:  runs shell commands, like typing in a terminal
# with: gives inputs (settings) to that action

jobs:
  checkout-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install dependencies
        working-directory: backend
        run: npm ci

      - name: Frontend install dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend:ci

      - name: Build frontend docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: frontend:ci

      - name: Trivy Scan Backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy Scan Frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  security-scan-with-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy Scan (dependencies, secrets, config)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # TEMPORARY: remove this step once the Sonar scan works.
      # Prints {"valid":true} if the token is accepted.
      - name: Validate Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: curl -s -u "$SONAR_TOKEN:" https://sonarcloud.io/api/authentication/validate

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  push-to-ghcr:
    needs: [checkout-build-and-test, security-scan-with-sonar]
    # Only push on direct pushes to dev or main (never on pull requests)
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: commit SHA, plus the branch name (dev or main)
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/fullstack-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/fullstack-backend:${{ github.ref_name }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/fullstack-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/fullstack-frontend:${{ github.ref_name }}