services:

  mongodb:
    image: mongo:7
    container_name: todo-mongodb
    restart: unless-stopped
    init: true

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_ROOT_DATABASE}

    volumes:
      - mongo-data:/data/db

    networks:
      - mongo-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true


  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: todo-backend
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 5000

      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_ROOT_DATABASE}?authSource=admin

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - application-network
      - mongo-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:5000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: todo-frontend
    restart: unless-stopped
    init: true

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - application-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true


  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: todo-nginx
    restart: unless-stopped
    init: true

    ports:
      - "80:8080"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    networks:
      - application-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/nginx-health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp


networks:
  application-network:
    driver: bridge

  mongo-network:
    driver: bridge


volumes:
  mongo-data: